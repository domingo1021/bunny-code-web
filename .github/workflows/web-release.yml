# Continuous delivery for the Next.js web app: every push to `main` that passes CI is
# published as a Docker image and rolled out to production, into the compose stack that the
# backend repository's release workflow maintains on the server. See the backend's
# docs/CICD.md.
#
#   ci       the whole of web-ci.yml
#   publish  image → ghcr.io/<owner>/bunny-web:{sha-<commit>, main}, built against the public
#            API URL (NEXT_PUBLIC_* values are compiled into the browser bundle)
#   deploy   Docker/deploy/deploy.sh web <tag> on the server: pull, restart `web`, wait for
#            its health check, roll back on failure
#
# Re-deploy or roll back by hand: Actions → web-release → Run workflow, with an existing tag.
name: web-release

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "Archives/**", ".claude/**", ".idea/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (e.g. sha-1a2b3c4d5e6f). Empty = build this commit."
        required: false
        default: ""

concurrency:
  group: release-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: ${{ inputs.tag == '' }}
    uses: ./.github/workflows/web-ci.yml
    secrets: inherit

  publish:
    name: publish image
    needs: ci
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bunny-web" >> "$GITHUB_OUTPUT"

      - name: Check the public API URL is configured
        env:
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          [ -n "$PUBLIC_API_URL" ] || { echo "Set the PUBLIC_API_URL repository variable, e.g. https://domingoos.store/api/v2" >&2; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_REALTIME_URL=${{ vars.PUBLIC_REALTIME_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          provenance: true
          sbom: true

  deploy:
    name: deploy to production
    needs: [publish]
    if: ${{ always() && (needs.publish.result == 'success' || inputs.tag != '') }}
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.publish.outputs.tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' \
            "$HOST" "$USER_NAME" >> ~/.ssh/config

      # The compose stack and deploy script are put on the server by the backend's release.
      - name: Check the stack is installed
        run: |
          ssh prod "test -x '$DEPLOY_PATH/Docker/deploy/deploy.sh'" || {
            echo "Deploy the backend first - its release installs the compose stack on the server." >&2
            exit 1
          }

      - name: Log the server in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Roll out web:${{ env.TAG }}
        run: ssh prod "'$DEPLOY_PATH/Docker/deploy/deploy.sh' web '$TAG'"

      - name: Log the server out of GHCR
        if: always()
        run: ssh prod "docker logout ghcr.io" || true
